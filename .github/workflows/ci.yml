name: CyberPath CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Keep this tag exactly equal to the @playwright/test version in package-lock.
    # The image already contains Chromium, WebKit and every system dependency.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Prepare logs
        run: mkdir -p reports
      - name: Install dependencies
        run: npm ci 2>&1 | tee reports/install.log
      - name: TypeScript
        run: npm run typecheck 2>&1 | tee reports/typecheck.log
      - name: ESLint
        run: npm run lint 2>&1 | tee reports/lint.log
      - name: Unit tests
        run: npm test 2>&1 | tee reports/unit.log
      - name: Production build
        run: npm run build 2>&1 | tee reports/build.log
      - name: Verify container browsers
        run: |
          node --version
          npm --version
          npx playwright --version
          id
          getent hosts localhost
          node -e 'const fs = require("node:fs"); const { chromium, webkit } = require("@playwright/test"); for (const [name, browser] of [["chromium", chromium], ["webkit", webkit]]) { const path = browser.executablePath(); if (!fs.existsSync(path)) { console.error(name + " missing: " + path); process.exit(1); } console.log(name + ": " + path); }' 2>&1 | tee reports/browsers.log
      - name: Browser regression
        run: npm run test:e2e -- --reporter=list,html 2>&1 | tee reports/e2e.log
      - name: Network origin regression
        run: npm run test:lan 2>&1 | tee reports/lan.log
      - name: Preserve failure reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failure-reports-${{ github.run_attempt }}
          path: |
            reports/
            playwright-report/
            test-results/
            test-results-lan/
          if-no-files-found: ignore
          retention-days: 7
